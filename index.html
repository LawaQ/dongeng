<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315d45">
  <title>E-Book Dongeng Digital — Kelas III SD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div><strong>E-Book Dongeng Digital</strong><small>Bahasa Indonesia · Kelas III SD / Fase B</small></div>
    </div>
    <button id="toggleContents" class="icon-button" type="button" aria-expanded="true" aria-controls="contents">☰ <span>Daftar halaman</span></button>
  </header>
  <main class="app-shell">
    <aside id="contents" class="contents" aria-label="Daftar halaman">
      <div class="contents-heading"><div><strong>Daftar Halaman</strong><small>30 halaman</small></div><span class="count" id="contentsCount">01 / 30</span></div>
      <nav id="pageList" class="page-list"></nav>
      <div class="offline-note"><span class="offline-dot"></span><span>Mode offline · Tidak memerlukan internet</span></div>
    </aside>
    <section class="reader" aria-label="Pembaca e-book">
      <div class="reader-heading">
        <div><span class="eyebrow">SEDANG DIBACA</span><h1 id="pageTitle">Sampul</h1></div>
        <div class="page-indicator" id="pageIndicator">01 <span>/</span> 30</div>
      </div>
      <div class="progress-track" aria-label="Progres membaca"><div id="progressBar" class="progress-bar"></div></div>
      <div class="page-stage">
        <button id="prevPage" class="page-arrow prev" type="button" aria-label="Halaman sebelumnya" title="Halaman sebelumnya">‹</button>
        <img id="pageImage" class="page-image" src="assets/pages/page-01.jpg" alt="Halaman 1 e-book Dongeng Digital" fetchpriority="high">
        <button id="nextPage" class="page-arrow next" type="button" aria-label="Halaman berikutnya" title="Halaman berikutnya">›</button>
      </div>
      <div class="reader-controls">
        <button id="prevBottom" class="nav-button secondary" type="button">← Sebelumnya</button>
        <label class="jump-control">Ke halaman <input id="pageInput" type="number" min="1" max="30" value="1" inputmode="numeric"><button id="goPage" type="button">Buka</button></label>
        <button id="nextBottom" class="nav-button primary" type="button">Berikutnya →</button>
      </div>
      <p class="reader-hint">Gunakan tombol navigasi atau pilih halaman pada daftar di sebelah kiri.</p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
